##### Core ergonomics #####


# Mouse
set -g mouse on


##### Pane movement #####
# With prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### Splits #####
# Vertical (side-by-side)
bind v split-window -h
# Horizontal (stacked)
bind o split-window -v

# Keep working directory when splitting
set -g default-command "${SHELL}"

##### Quality-of-life #####

# Quick reload
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded ✨"



##### Catppuccin Mocha (no plugins) #####

# Truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Palette (Mocha)
# crust #11111b | mantle #181825 | base #1e1e2e
# surface0 #313244 | surface1 #45475a
# text #cdd6f4 | subtext0 #a6adc8
# blue #89b4fa | mauve #cba6f7 | green #a6e3a1 | peach #fab387 | red #f38ba8

# Status bar
set -g status on
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-position bottom

# Panes
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Messages / prompt
set -g message-style "bg=#11111b,fg=#cdd6f4"
set -g message-command-style "bg=#11111b,fg=#fab387"

# Windows
setw -g window-status-separator ""
setw -g window-status-style "bg=#181825,fg=#a6adc8"
setw -g window-status-format " #[fg=#a6adc8]#I:#W#[default] "
setw -g window-status-current-format " #[bg=#89b4fa,fg=#11111b,bold] #I:#W #[default] "

# Left: session
set -g status-left-length 80
set -g status-left " #[bg=#cba6f7,fg=#11111b,bold]   #S  #[bg=#181825,fg=#cba6f7]#[default] "

# Right: host + date + time
set -g status-right-length 120
set -g status-right " #[fg=#a6adc8]#H  #[fg=#fab387]%Y-%m-%d  #[fg=#a6e3a1] %H:%M #[default] "

# Optional: activity (subtle)
setw -g monitor-activity on
set -g visual-activity off
